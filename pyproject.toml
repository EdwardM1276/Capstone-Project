[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paysim-fraud-detection"
version = "1.0.0"
description = "Reproducible mobile-money fraud detection using the PaySim dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imbalanced-learn>=0.12,<0.15",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.7",
    "scipy>=1.10",
    "seaborn>=0.13",
    "streamlit>=1.49",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["fraud_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
